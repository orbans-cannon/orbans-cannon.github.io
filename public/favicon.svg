<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Orban’s Cannon</title>
  <!-- 白底黑圖：烏爾班大砲（後段藥室細、前段砲管粗、兩道鐵箍）、木架、飛出的砲彈 -->
  <rect width="128" height="128" rx="24" fill="#fff"/>
  <g transform="translate(4 -7)">
  <!-- 木架：楔形，砲身斜靠在上面 -->
  <path d="M12 116 L100 116 L100 104 L12 112 Z" fill="#111"/>
  <g transform="rotate(-24 54 84)">
    <rect x="6" y="73" width="30" height="24" rx="5" fill="#111"/>
    <rect x="30" y="64" width="58" height="42" rx="6" fill="#111"/>
    <rect x="45" y="64" width="4" height="42" fill="#fff"/>
    <rect x="66" y="64" width="4" height="42" fill="#fff"/>
    <ellipse cx="90" cy="85" rx="6.5" ry="22" fill="#111"/>
    <ellipse cx="91" cy="85" rx="3" ry="11" fill="#fff"/>
  </g>
  </g>
  <!-- 砲彈 -->
  <circle cx="108" cy="22" r="10" fill="#111"/>
</svg>
