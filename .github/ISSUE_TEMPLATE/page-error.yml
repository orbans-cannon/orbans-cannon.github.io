name: 頁面錯誤或建議 / Page error or suggestion
description: 回報內容錯誤、不清楚的地方、錯字，或對某一頁的建議。Report an error, an unclear passage, a typo, or a suggestion.
labels: []
body:
  - type: input
    id: url
    attributes:
      label: 頁面網址 / Page URL
      placeholder: https://orbans-cannon.github.io/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 哪裡不對，或你的建議 / What is wrong, or what you suggest
      description: 如果是內容錯誤，請盡量附上依據（論文的章節或頁碼）。For a content error, please cite the paper section or page if you can.
    validations:
      required: true
